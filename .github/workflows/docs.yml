name: docs

on:
  push:
    branches: [main]
    paths:
      - "src/uniqat/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package with docs extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[deep,web,dev]"

      - name: Build API documentation
        run: |
          python -m pdoc \
            -o site \
            -d numpy \
            --logo https://raw.githubusercontent.com/open-AIMS/UNIQAT/main/docs/assets/logo.png \
            --logo-link https://github.com/open-AIMS/UNIQAT \
            uniqat

      - name: Rewrite index page titles
        run: python docs/postprocess.py site

      - name: Upload artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # GATED: only runs when manually dispatched from the Actions tab.
    # Flip this to remove the condition (or change to `if: true`) once
    # GitHub Pages has been enabled on the repository:
    #   Settings -> Pages -> Source: "GitHub Actions"
    # Until then, push events only run the `build` smoke job and do not
    # attempt to deploy, so no failure notifications are generated.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
