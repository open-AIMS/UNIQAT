[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniqat"
version = "1.0.2"
description = "UNIQAT: UNderwater Image QUality Assessment Toolkit. Reference-free underwater image quality assessment with 37 metrics across nine categories, optional deep learning models, a Gradio web UI, and SLURM job scripts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Alzayat Saleh", email = "alzayat.saleh@my.jcu.edu.au" },
    { name = "Arjun Chennu" },
]
maintainers = [
    { name = "Alzayat Saleh", email = "alzayat.saleh@my.jcu.edu.au" },
]
keywords = [
    "underwater image quality",
    "reference-free image quality assessment",
    "marine surveys",
    "coral reef imaging",
    "computer vision",
    "deep learning",
    "Australian Institute of Marine Science",
    "James Cook University",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.5",
    "Pillow>=9.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tqdm>=4.60",
]

[project.optional-dependencies]
deep = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9",
    "albumentations>=1.3",
]
web = [
    "gradio>=4.0",
]
gpu = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9",
    "albumentations>=1.3",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "pdoc>=14.4",
    "pyyaml>=6.0",
]
all = [
    "uniqat[deep,web,dev]",
]

[project.urls]
Homepage = "https://github.com/open-AIMS/UNIQAT"
Repository = "https://github.com/open-AIMS/UNIQAT"
Issues = "https://github.com/open-AIMS/UNIQAT/issues"
Changelog = "https://github.com/open-AIMS/UNIQAT/blob/main/CHANGELOG.md"

[project.scripts]
uniqat-assess = "uniqat.cli:main"
uniqat-train = "uniqat.cli_train:main"
uniqat-web = "uniqat.cli_web:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["uniqat*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "scripts",
    "examples",
    "tests",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",
    "E741",
    "E731",
    "F403",
    "F405",
]

[tool.ruff.lint.per-file-ignores]
# Pre-existing dead-code assignments in the algorithmic modules. Fixing them
# would require a structural edit to paper-accompanying code; the assignments
# are otherwise harmless.
"src/uniqat/core/metrics.py" = ["F841"]
"src/uniqat/models/deep_models.py" = ["F841"]
"src/uniqat/utils/gpu_accelerator.py" = ["F841"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: tests that take more than a minute",
    "gpu: tests that require a GPU",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
